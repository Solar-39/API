    <script>

        function pesquisarCep() {

            document.getElementById("erro").textContent = "";

            document.getElementById("rua").value = "";
            document.getElementById("bairro").value = "";
            document.getElementById("cidade").value = "";
            document.getElementById("estado").value = "";

            const validacep = /^[0-9]{8}$/;

            const cep =
                document.getElementById("cep").value;


            if (validacep.test(cep)) {

                const link =
                    "https://viacep.com.br/ws/" +
                    cep +
                    "/json/?callback=preencherEndereco";


                const script =
                    document.createElement("script");


                script.src = link;


                document.body.appendChild(script);

            }

            else {

                document.getElementById("erro").textContent =
                    "O CEP digitado é inválido ♡";

                document.getElementById("cep").value = "";
            }
        }


        function preencherEndereco(conteudo) {

            if (!("erro" in conteudo)) {

                document.getElementById("rua").value =
                    conteudo.logradouro;

                document.getElementById("bairro").value =
                    conteudo.bairro;

                document.getElementById("cidade").value =
                    conteudo.localidade;

                document.getElementById("estado").value =
                    conteudo.uf;

            }

            else {

                document.getElementById("erro").textContent =
                    "O CEP digitado não existe ♡";
            }
        }

    </script>

    <script>
        function pegar_dados() {
            const dados = {
                nome: document.getElementById("nome").value,
                cpf: document.getElementById("cpf").value,
                celular: document.getElementById("celular").value,
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            }
            return dados
        }
        const form = document.getElementById("form_cadastro")
        const btn_enviar = document.getElementById("btn_enviar")
        form.addEventListener("submit", async (event) => {
            event.preventDefault() // evita o recarregamento da página
            btn_enviar.disabled = true
            btn_enviar.value = "Enviando..."
            const dados = pegar_dados()
            try {
                const resposta = await fetch(
                    "http://10.216.243.142:3000/cliente", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(dados)
                    }
                )
                if (!resposta.ok) throw new Error("Erro na API")
                alert("O cadastro foi realizado!")
                form.reset()
            } catch (error) {
                alert(error)
            } finally {
                btn_enviar.disabled = false
                btn_enviar.value = "Enviar Cadastro"
            }
        })
    </script>
