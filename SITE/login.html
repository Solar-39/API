<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Borel&family=DynaPuff:wght@400;500;600&family=Fredoka:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <!-- Decorações -->

    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    <div class="decoration decoration-3"></div>
    <div class="decoration decoration-4"></div>
    <div class="decoration decoration-5"></div>


    <main>

        <h1>
            ♡ Login ♡
        </h1>


        <form>

            <label for="email">
                Email:
            </label>

            <input
                type="email"
                id="email"
                placeholder="illit@email.com"
                required
                class="input-texto"
            >


            <label for="senha">
                Senha:
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Billyeon_Goyangi"
                required
                class="input-texto"
            >


            <input
                type="submit"
                value="Entrar ✦"
                class="btn_enviar"
            >

        </form>

    </main>

</body>

</html>
